<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Протокол разработки</title>
  <desc id="desc">Шесть этапов: план, ревью плана, реализация, верификация, двойное ревью и финальный гейт всей ветки.</desc>
  <defs>
