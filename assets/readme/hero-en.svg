<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">superpowers-strigov-ver</title>
  <desc id="desc">A multi-model delivery control plane for Claude Code, showing Sonnet orchestration connected to independent planning, implementation, review, and verification roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#111831"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#26304D" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <path d="M0 1H1200" stroke="#7C8CFF" stroke-width="2" opacity=".75"/>

  <g id="identity" transform="translate(62 54)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2.2">
      <circle cx="7" cy="-6" r="6" fill="#35D6A6"/>
      <text x="24" y="0" fill="#AEB8D4">CLAUDE CODE / DELIVERY CONTROL PLANE</text>
    </g>

    <text x="0" y="78" fill="#F5F7FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="750">superpowers</text>
    <text x="0" y="135" fill="#7C8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="700">strigov-ver</text>

    <g fill="#D7DDF0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">
      <text x="0" y="187">Plan. Build. Independent review.</text>
      <text x="0" y="221">Durable state for long sessions.</text>
    </g>

    <g transform="translate(0 276)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <rect width="120" height="38" rx="19" fill="#18213D" stroke="#46547D"/>
      <text x="60" y="25" text-anchor="middle" fill="#E7EBFA">v0.6.1</text>
      <rect x="132" width="160" height="38" rx="19" fill="#132B2A" stroke="#277C67"/>
      <text x="212" y="25" text-anchor="middle" fill="#73E6C1">MIT LICENSE</text>
      <rect x="304" width="204" height="38" rx="19" fill="#211D38" stroke="#665CA0"/>
      <text x="406" y="25" text-anchor="middle" fill="#C8C0FF">MULTI-MODEL</text>
    </g>
  </g>

  <g id="orchestration-map" transform="translate(650 48)">
    <rect width="492" height="324" rx="22" fill="#0D1428" stroke="#35405F" stroke-width="1.5"/>
    <text x="26" y="34" fill="#8F9AB8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5">LIVE ROLE TOPOLOGY</text>

    <path d="M246 156V82M246 156L98 246M246 156L394 246M246 156H98M246 156H394" fill="none" stroke="#536189" stroke-width="2" stroke-dasharray="5 7"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <g transform="translate(159 118)">
        <rect width="174" height="76" rx="16" fill="#202A56" stroke="#7C8CFF" stroke-width="2"/>
        <circle cx="24" cy="24" r="7" fill="#35D6A6"/>
        <text x="43" y="31" fill="#F7F8FF" font-size="22" font-weight="700">Sonnet</text>
        <text x="24" y="57" fill="#AFB8D4" font-size="17">orchestrates</text>
      </g>

      <g transform="translate(172 48)">
        <rect width="148" height="58" rx="14" fill="#151D36" stroke="#4A587D"/>
        <text x="74" y="25" text-anchor="middle" fill="#F3F5FF" font-size="19" font-weight="650">Sol</text>
        <text x="74" y="46" text-anchor="middle" fill="#98A4C3" font-size="15">plans + controls</text>
      </g>

      <g transform="translate(24 126)">
        <rect width="134" height="60" rx="14" fill="#151D36" stroke="#4A587D"/>
        <text x="67" y="26" text-anchor="middle" fill="#F3F5FF" font-size="19" font-weight="650">Opus</text>
        <text x="67" y="47" text-anchor="middle" fill="#98A4C3" font-size="15">judges</text>
      </g>

      <g transform="translate(334 126)">
        <rect width="134" height="60" rx="14" fill="#151D36" stroke="#4A587D"/>
        <text x="67" y="26" text-anchor="middle" fill="#F3F5FF" font-size="19" font-weight="650">Luna</text>
        <text x="67" y="47" text-anchor="middle" fill="#98A4C3" font-size="15">implements</text>
      </g>

      <g transform="translate(30 226)">
        <rect width="140" height="60" rx="14" fill="#241E30" stroke="#8A6845"/>
        <text x="70" y="26" text-anchor="middle" fill="#FFDAA9" font-size="19" font-weight="650">Fable</text>
        <text x="70" y="47" text-anchor="middle" fill="#BCA98F" font-size="15">escalates</text>
      </g>

      <g transform="translate(322 226)">
        <rect width="140" height="60" rx="14" fill="#142A2A" stroke="#2E806C"/>
        <text x="70" y="26" text-anchor="middle" fill="#9AF0D2" font-size="19" font-weight="650">Gate</text>
        <text x="70" y="47" text-anchor="middle" fill="#8DBCAD" font-size="15">verifies</text>
      </g>
    </g>

    <g transform="translate(194 302)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7F8AA8">
      <text x="0" y="0">PLAN</text><text x="50" y="0" fill="#4E5D82">→</text>
      <text x="70" y="0">CODE</text><text x="120" y="0" fill="#4E5D82">→</text>
      <text x="140" y="0">PROOF</text>
    </g>
  </g>
</svg>
